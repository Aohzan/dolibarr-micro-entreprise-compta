---
name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module version
      placeholder: "7.1.0"
    validations:
      required: true
  - type: input
    id: dolibarr
    attributes:
      label: Dolibarr and PHP versions
      placeholder: "Dolibarr 24.0.1, PHP 8.4"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: PHP errors, Dolibarr logs (dolibarr.log) or screenshots. Remove any personal data.
